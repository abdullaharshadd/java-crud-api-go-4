services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "mysql://app:app@mysql:3306/app"
      DB_HOST: "mysql"
      DB_NAME: "app"
      DB_PASSWORD: "app"
      DB_PORT: "3306"
      DB_USER: "app"
      DB_USERNAME: "app"
      JWT_SECRET: "test-secret"
      MYSQL_URL: "mysql://app:app@mysql:3306/app"
      PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "app"
      MYSQL_DATABASE: "app"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "app"
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -papp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
